name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Unit tests and deterministic distribution
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest -q

      - name: Generate synthetic fixtures
        run: python test-data/generate_test_data.py

      - name: Verify three reproducible runs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p result
          for run in 1 2 3; do
            python skill/scripts/distribute.py \
              --ful test-data/ful_1c.xlsx \
              --cloud test-data/cloud_registry.xlsx \
              --staff test-data/staff_1c.xlsx \
              --out "result/run-${run}" > "result/summary-${run}.json"
            python test-data/check_results.py "result/run-${run}/result.xlsx"
          done

          sha256sum result/run-*/result.xlsx
          unique_hashes="$(sha256sum result/run-*/result.xlsx | awk '{print $1}' | sort -u | wc -l)"
          test "$unique_hashes" -eq 1

      - name: Verify automatic input-role detection
        shell: bash
        run: |
          set -euo pipefail
          python skill/scripts/distribute.py \
            --files \
              test-data/staff_1c.xlsx \
              test-data/ful_1c.xlsx \
              test-data/cloud_registry.xlsx \
            --out result/auto > result/summary-auto.json
          python test-data/check_results.py result/auto/result.xlsx
          cmp result/run-1/result.xlsx result/auto/result.xlsx

      - name: Upload verified result
        uses: actions/upload-artifact@v4
        with:
          name: verified-result
          path: |
            result/run-1/result.xlsx
            result/summary-*.json
          retention-days: 7
